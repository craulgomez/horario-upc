name: HorarioUPC CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test & Build (Java 21 / Spring Boot 3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y Ejecutar Pruebas Unitarias
        working-directory: ./backend
        run: mvn clean test --batch-mode

  frontend-build:
    name: Frontend Build & Type Check (React / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Instalar Dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Type Check y Compilación de Producción
        working-directory: ./frontend
        run: npm run build
